<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#13151b" />
      <stop offset="100%" stop-color="#090a0f" />
    </linearGradient>
    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#30d158" />
    </linearGradient>
  </defs>
  <!-- Background squircle -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="111" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="4"/>
  
  <!-- Outer subtle glow circle -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="rgba(48,209,88,0.12)" stroke-width="6" stroke-dasharray="6 12"/>

  <!-- Pulse EKG / Lightning Monogram -->
  <path d="M110 270 L170 270 L210 170 L260 360 L310 220 L345 270 L402 270" 
        fill="none" 
        stroke="url(#pulseGrad)" 
        stroke-width="28" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>

  <!-- Center Heart dot -->
  <circle cx="260" cy="360" r="12" fill="#30d158" />
  <circle cx="210" cy="170" r="10" fill="#34d399" />
</svg>