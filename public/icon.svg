<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="55%" stop-color="#090c14" />
      <stop offset="100%" stop-color="#06080e" />
    </linearGradient>
    <linearGradient id="pulseGrad" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#00e5ff" />
      <stop offset="55%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.22" />
      <stop offset="65%" stop-color="#8b5cf6" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#06080e" stop-opacity="0" />
    </radialGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Obsidian Squircle Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect x="6" y="6" width="500" height="500" rx="108" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="4" />

  <!-- Subtle Radial Glow -->
  <circle cx="256" cy="256" r="200" fill="url(#coreGlow)" />

  <!-- Precision Telemetry Ring (inside maskable safe zone) -->
  <circle cx="256" cy="256" r="168" fill="none" stroke="rgba(0,229,255,0.16)" stroke-width="5" stroke-dasharray="10 14" />
  <circle cx="256" cy="256" r="144" fill="none" stroke="rgba(139,92,246,0.18)" stroke-width="3" />

  <!-- Glowing EKG Heart-Rate Pulse Line -->
  <path d="M112 264 L168 264 L198 188 L236 338 L278 158 L314 304 L344 264 L400 264"
        fill="none"
        stroke="url(#pulseGrad)"
        stroke-width="24"
        stroke-linecap="round"
        stroke-linejoin="round"
        filter="url(#neonGlow)" />

  <!-- Peak & Baseline Nodes -->
  <circle cx="278" cy="158" r="11" fill="#00e5ff" />
  <circle cx="236" cy="338" r="9" fill="#8b5cf6" />
  <circle cx="400" cy="264" r="9" fill="#a78bfa" />
</svg>